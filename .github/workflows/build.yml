name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev \
            libtool \
            pkg-config \
            autoconf \
            automake

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Build with Buildozer
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          export BUILDOZER_ALLOW_KIVY_NEW_DESIGNER=1
          export APP_ALLOW_ROOT=1
          # গিটহাবের জোর করে দেওয়া পাথ মুছে ফেলার চূড়ান্ত ফিক্স
          export ANDROID_NDK_HOME="/home/runner/.buildozer/android/platform/android-ndk-r26c"
          export ANDROID_NDK_ROOT="/home/runner/.buildozer/android/platform/android-ndk-r26c"
          # ব্যাকগ্রাউন্ডের সব জটলা সাফ করার কম্যান্ড
          buildozer android clean
          yes | buildozer android debug log_level=2
